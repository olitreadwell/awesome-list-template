[project]
name = "awesome-list"
version = "0.1.0"
description = "Engine and template for maintaining an awesome list: parse, check, export, publish."
requires-python = ">=3.12"
readme = "readme.md"
license = { file = "license" }
dependencies = [
    "markdown-it-py==4.2.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-randomly==5.0.0",
    "mypy==2.3.1",
    "ruff==0.16.8",
    "codespell==2.4.3",
    "jsonschema==4.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/awesome_list"]

[tool.uv]
package = true

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["awesome_list"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests"]
pretty = true
show_error_codes = true

[tool.codespell]
# "ons" is the Office for National Statistics abbreviation, and the tests use it
# to prove that short keywords match whole words only.
ignore-words-list = "ons"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "e2e: end to end specs that need a built site",
]
