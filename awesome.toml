# Configuration for this awesome list. Everything the engine needs beyond
# readme.md lives here.

name = "Awesome Example"
repo_slug = "awesome-example"
badge = "default"
readme = "readme.md"

sections = [
    "Start here",
    "Tools",
    "Data",
    "Acknowledgements",
]

[site]
# Off by default. Turning this on adds HTML, a search index, E2E, and
# Lighthouse to the gate, plus a publish job that pushes the gh-pages branch.
enabled = false

[links]
# "off" reports dead entries and does nothing else.
# "local" saves a single file copy under archive/ and moves the entry to
# legacy.md.
# "wayback" asks the Internet Archive for an existing snapshot instead.
archive = "off"
exclude = []
allowlist = []

[links.archive_limits]
per_file_bytes = 2000000
total_bytes = 50000000

[structure]
# A sub-bullet under an entry is a grouping mistake by default. A list that
# hangs detail links such as "Home page" or "F-Droid" off an entry sets this to
# true and the engine reads those bullets as part of the entry above them.
nested_details = false

[github]
# Every GitHub link in the list carries stars and a last-push date, refreshed by
# make stats and checked offline by make stats-check. "stats" is on by default;
# turning it off is for lists that deliberately link no repositories.
stats = true
# Past this age the gate warns and asks for make stats instead of failing hard.
max_age_days = 14
snapshot = "github-stats.json"

[tags.type]
API = "⇄"
Data = "▦"
Portal = "☰"
Register = "☑"
Docs = "¶"

[tags.access]
Open = "○"
Key = "◑"
Login = "◕"
Paid = "●"

[tags.status]
Legacy = "⟳"
Archived = "▣"
